[station]
name = "Bench 1"
output_dir = "reports"
database_path = "reports/lna_bench.sqlite3"

[visa]
resource_name = "GPIB0::28::INSTR"
backend = ""
timeout_ms = 300000
read_termination = "\n"
write_termination = "\n"

[sweep]
start_hz = 10000000.0
stop_hz = 3000000000.0
# Use fewer sweep points for faster production throughput.
points = 121
key_frequencies_hz = [50000000.0, 144000000.0, 222000000.0, 432000000.0, 903000000.0, 1296000000.0, 2304000000.0]

[commands]
identify_query = "*IDN?"
opc_query = ""
prepare_measurement_commands = []
nf_data_query = "FETC:CORR:NFIG?"
gain_data_query = "FETC:CORR:GAIN?"
frequency_data_query = ""

# Optional direct key-point mode for speed:
# If all 3 commands below are set, key frequencies are measured directly at each target
# instead of being estimated from the coarse sweep trace.
# Available template variables: {frequency_hz}, {frequency_mhz}, {frequency_ghz}
key_point_set_frequency_command = ""
key_point_nf_query = ""
key_point_gain_query = ""
key_point_settle_ms = 0

# Optional state save/restore around each operation (probe/verify/record).
# Example for instruments supporting *LRN?:
# state_snapshot_query = "*LRN?"
# state_restore_command = "{state}"
state_snapshot_query = ""
state_restore_command = ""

[control]
acquire_commands = []
release_commands = []
release_to_local = true

[configuration]
# Add required pre-test setup commands here as you define your station state.
apply_commands = [
	"INIT:CONT ON",
]
fail_on_mismatch = true

verify_checks = [
	{ name = "continuous_sweep_enabled", query = "INIT:CONT?", expected = "1", match = "exact" },
]

[runtime]
single_instance = true
lock_stale_seconds = 1800
